# Remove the custom network configuration and use host networking
# networks:
#   default:
#     external:
#       name: mep-services-network

services:
  # API Gateway - Unified entry point for all client interactions
  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: mep-api-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config
      - CORE_SERVICE_URL=http://localhost:8001
      - DOCUMENT_ROUTER_URL=http://localhost:8002
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - STORAGE_MANAGER_URL=http://localhost:8004
    # Remove ports since we're using host networking
    # ports:
    #   - "8011:8000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - core-processor
    #   - document-router
    #   - processing-pipeline
    #   - storage-manager
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Core Processor - Main document processing orchestrator
  core-processor:
    build:
      context: ./core_processor
      dockerfile: Dockerfile
    container_name: mep-core-processor
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8001:8001"
    environment:
      - CONFIG_PATH=/app/config
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NEO4J_HOST=${NEO4J_HOST}
      - NEO4J_PORT=${NEO4J_PORT}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - DOCUMENT_ROUTER_URL=http://localhost:8002
      - PROCESSING_PIPELINE_URL=http://localhost:8003
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:rw
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - shared_scan_folders:/app/scan_folders:ro
    # Infrastructure services are managed externally
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8001)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Document Router - Intelligent document routing and processing
  document-router:
    build:
      context: ./document_router
      dockerfile: Dockerfile
    container_name: mep-document-router
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8002:8002"
    environment:
      - CONFIG_PATH=/app/config
      - CORE_PROCESSOR_URL=http://localhost:8001
      - PROCESSING_PIPELINE_URL=http://localhost:8003
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${WATCH_FOLDER_PATH:-./watch_folder}:/app/watch_folder:ro
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - core-processor
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8002)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Processing Pipeline - Orchestrated document processing workflow
  processing-pipeline:
    build:
      context: ./processing_pipeline
      dockerfile: Dockerfile
    container_name: mep-processing-pipeline
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8003:8003"
    environment:
      - CONFIG_PATH=/app/config
      - CORE_PROCESSOR_URL=http://localhost:8001
      - STORAGE_MANAGER_URL=http://localhost:8004
      - TEXT_PROCESSOR_URL=http://localhost:8005
      - EMBEDDING_PROCESSOR_URL=http://localhost:8007
      - DYNAMIC_TEXT_PROCESSOR_SCRIPT=/app/core/core/text_processor_dynamic.sh
      - EMBEDDING_PROVIDER=huggingface
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ../:/app/core:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - ${TEMP_PROCESSING_PATH:-./temp}:/app/temp:rw
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - core-processor
    #   - storage-manager
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8003)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Queue Worker - Background job processor for guaranteed document processing
  queue-worker:
    build:
      context: ./processing_pipeline
      dockerfile: Dockerfile
    container_name: mep-queue-worker
    restart: unless-stopped
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config
      - CORE_PROCESSOR_URL=http://localhost:8001
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ../:/app/core:ro
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - ${TEMP_PROCESSING_PATH:-./temp}:/app/temp:rw
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    #   - core-processor
    command: ["python3", "/app/queue_worker.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:8003/health'); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Status Worker - Background status update processor for reliable status synchronization
  status-worker:
    build:
      context: ./processing_pipeline
      dockerfile: Dockerfile
    container_name: mep-status-worker
    restart: unless-stopped
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config
      - CORE_PROCESSOR_URL=http://localhost:8001
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ../:/app/core:ro
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - ${TEMP_PROCESSING_PATH:-./temp}:/app/temp:rw
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    #   - core-processor
    command: ["python3", "/app/status_worker.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:8003/health'); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Storage Manager - Unified data storage and retrieval interface
  storage-manager:
    build:
      context: ./storage_manager
      dockerfile: Dockerfile
    container_name: mep-storage-manager
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8004:8004"
    environment:
      - CONFIG_PATH=/app/config
      - POSTGRES_HOST=postgres
      - ELASTICSEARCH_HOST=elasticsearch
      - QDRANT_HOST=qdrant
      - NEO4J_HOST=neo4j
      - MINIO_HOST=minio
      - REDIS_HOST=redis
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - shared_scan_folders:/app/scan_folders:ro
    # Infrastructure services are managed externally
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8004)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Metadata Processor - Metadata extraction and validation
  metadata-processor:
    build:
      context: ./processors/metadata_processor
      dockerfile: Dockerfile
    container_name: mep-metadata-processor
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8006:8006"
    environment:
      - CONFIG_PATH=/app/config
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - CORE_PROCESSOR_URL=http://localhost:8001
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8006)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Text Processor - Document text extraction service
  text-processor:
    build:
      context: ./processors/text_processor
      dockerfile: Dockerfile
    container_name: mep-text-processor
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8005:8005"
    environment:
      - CONFIG_PATH=/app/config
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - CORE_PROCESSOR_URL=http://localhost:8001
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:rw
      - ${WATCH_FOLDER_PATH:-./watch_folder}:/app/watch_folder:ro
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8005)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Ollama - Self-hosted LLM and embedding service
  ollama:
    image: ollama/ollama:latest
    container_name: mep-ollama
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 11434)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Embedding Processor - Vector embedding generation using Ollama or HuggingFace
  embedding-processor:
    build:
      context: ./processors/embedding_processor
      dockerfile: Dockerfile
    container_name: mep-embedding-processor
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8007:8007"
    environment:
      - CONFIG_PATH=/app/config
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - CORE_PROCESSOR_URL=http://localhost:8001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=qdrant_api_key
      # Embedding provider configuration
      - EMBEDDING_PROVIDER=huggingface
      - OLLAMA_HOST=localhost
      - OLLAMA_PORT=11434
      - OLLAMA_DEFAULT_MODEL=nomic-embed-text
      # HuggingFace configuration (default)
      - HF_DEFAULT_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - HF_CACHE_DIR=/app/cache/huggingface
      - HF_DEVICE=cpu
      - HF_BATCH_SIZE=32
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:ro
      - huggingface_cache:/app/cache/huggingface
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    # Qdrant is managed externally
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8007)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Entity Processor - Entity extraction and relationship mapping
  entity-processor:
    build:
      context: ./processors/entity_processor
      dockerfile: Dockerfile
    container_name: mep-entity-processor
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8008:8008"
    environment:
      - CONFIG_PATH=/app/config
      - PROCESSING_PIPELINE_URL=http://localhost:8003
      - CORE_PROCESSOR_URL=http://localhost:8001
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7474
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:ro
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - processing-pipeline
    # Neo4j is managed externally
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8008)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # File Watcher - Monitor local folders for new documents
  file-watcher:
    build:
      context: .
      dockerfile: file_watcher/Dockerfile
    container_name: mep-file-watcher
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8009:8009"
    environment:
      - CONFIG_PATH=/app/config
      - CORE_PROCESSOR_URL=http://localhost:8001
      - WATCH_PATHS=/app/watch_folder
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${WATCH_FOLDER_PATH:-./watch_folder}:/app/watch_folder:rw
      - shared_scan_folders:/app/scan_folders:ro
    # Remove depends_on since we're using host networking
    # depends_on:
    #   - core-processor
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8009)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Host Volume Manager - Dynamic folder mounting service
  host-volume-manager:
    build:
      context: .
      dockerfile: host_volume_manager/Dockerfile
    container_name: mep-host-volume-manager
    restart: unless-stopped
    network_mode: host
    # Remove ports since we're using host networking
    # ports:
    #   - "8011:8011"
    environment:
      - CONFIG_PATH=/app/config
      - VOLUME_NAME=shared_scan_folders
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - shared_scan_folders:/app/scan_folders:rw
      - /:/host:ro  # Mount host filesystem for dynamic folder access
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket for Docker operations
    # Remove depends_on since we're using host networking
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8011)); s.close(); print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard - Admin interface and monitoring
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: mep-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config
      - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-mep_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mep_password}
      - POSTGRES_DB=${POSTGRES_DB:-mep_ainabox}
      - QDRANT_HOST=${QDRANT_HOST:-localhost}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-localhost}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-elastic_password}
      - NEO4J_HOST=${NEO4J_HOST:-localhost}
      - NEO4J_PORT=${NEO4J_PORT:-7474}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - MINIO_HOST=${MINIO_HOST:-localhost}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-documents}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
    volumes:
      - ./dashboard:/app:rw
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ${LOCAL_DOCUMENTS_PATH:-./documents}:/app/documents:ro
      - ${PROCESSED_DOCUMENTS_PATH:-./processed}:/app/processed:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  documents:
    driver: local
  processed:
    driver: local
  temp:
    driver: local
  logs:
    driver: local
  ollama_data:
    driver: local
  huggingface_cache:
    driver: local
  shared_scan_folders:
    driver: local
  
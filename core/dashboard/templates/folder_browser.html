<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDIS Dashboard - Folder Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    <style>
        .folder-browser {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .folder-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border: 1px solid transparent;
        }
        .folder-item:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
        }
        .folder-item.selected {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        .file-item {
            padding: 6px 12px;
            border-radius: 4px;
            color: #6c757d;
        }
        .breadcrumb-item {
            cursor: pointer;
        }
        .breadcrumb-item:hover {
            color: #007bff;
        }
        .mounted-folders {
            background-color: #e8f5e8;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .folder-actions {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .path-display {
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-success { background-color: #28a745; }
        .status-error { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
        .status-info { background-color: #17a2b8; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                        <li class="breadcrumb-item active">Folder Browser</li>
                    </ol>
                </nav>
                
                <h2><i class="fas fa-folder-open"></i> Dynamic Folder Browser</h2>
                <p class="text-muted">Browse and select folders for dynamic mounting and scanning</p>
                
                <!-- Mounted Folders Section -->
                <div class="mounted-folders">
                    <h4><i class="fas fa-hdd"></i> Currently Mounted Folders</h4>
                    <div id="mountedFoldersList">
                        <div class="text-muted">Loading mounted folders...</div>
                    </div>
                </div>
                
                <!-- Folder Actions -->
                <div class="folder-actions">
                    <h4><i class="fas fa-cogs"></i> Folder Actions</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <button class="btn btn-success" onclick="mountSelectedFolder()">
                                <i class="fas fa-plus"></i> Mount Selected Folder
                            </button>
                            <button class="btn btn-warning" onclick="unmountSelectedFolder()">
                                <i class="fas fa-minus"></i> Unmount Selected
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-primary" onclick="startScanSelectedFolder()">
                                <i class="fas fa-play"></i> Start Scan
                            </button>
                            <button class="btn btn-info" onclick="refreshMountedFolders()">
                                <i class="fas fa-sync"></i> Refresh
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Folder Browser -->
                <div class="folder-browser">
                    <h4><i class="fas fa-folder"></i> Folder Browser</h4>
                    
                    <!-- Breadcrumb Navigation -->
                    <nav aria-label="folder-breadcrumb">
                        <ol class="breadcrumb" id="folderBreadcrumb">
                            <li class="breadcrumb-item active">/</li>
                        </ol>
                    </nav>
                    
                    <!-- Current Path Display -->
                    <div class="mb-3">
                        <label class="form-label">Current Path:</label>
                        <div class="path-display" id="currentPath">/</div>
                    </div>
                    
                    <!-- Folder Options -->
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="showHidden">
                            <label class="form-check-label" for="showHidden">
                                Show hidden files and folders
                            </label>
                        </div>
                    </div>
                    
                    <!-- Folder Contents -->
                    <div id="folderContents">
                        <div class="text-muted">Loading folder contents...</div>
                    </div>
                </div>
                
                <!-- Status Messages -->
                <div id="statusMessages"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPath = "/";
        let selectedFolder = null;
        let mountedFolders = [];
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadMountedFolders();
            browseFolder("/");
            
            // Add event listener for show hidden checkbox
            document.getElementById('showHidden').addEventListener('change', function() {
                browseFolder(currentPath);
            });
        });
        
        // Load mounted folders
        async function loadMountedFolders() {
            try {
                const response = await fetch('/api/folder/list');
                const data = await response.json();
                
                if (data.error_message) {
                    showStatus('error', `Error loading mounted folders: ${data.error_message}`);
                    return;
                }
                
                mountedFolders = data.folders || [];
                updateMountedFoldersDisplay();
                
            } catch (error) {
                showStatus('error', `Error loading mounted folders: ${error.message}`);
            }
        }
        
        // Update mounted folders display
        function updateMountedFoldersDisplay() {
            const container = document.getElementById('mountedFoldersList');
            
            if (mountedFolders.length === 0) {
                container.innerHTML = '<div class="text-muted">No folders currently mounted</div>';
                return;
            }
            
            const html = mountedFolders.map(folder => `
                <div class="d-flex justify-content-between align-items-center mb-2 p-2 bg-light rounded">
                    <span><i class="fas fa-folder"></i> ${folder}</span>
                    <button class="btn btn-sm btn-outline-danger" onclick="unmountFolder('${folder}')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // Browse folder contents
        async function browseFolder(path) {
            try {
                const showHidden = document.getElementById('showHidden').checked;
                
                const response = await fetch('/api/folder/browse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: path,
                        show_hidden: showHidden
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showStatus('error', `Error browsing folder: ${data.error}`);
                    return;
                }
                
                currentPath = data.current_path;
                updateBreadcrumb(data.current_path, data.parent_path);
                updateCurrentPathDisplay(data.current_path);
                updateFolderContents(data.folders, data.files);
                
            } catch (error) {
                showStatus('error', `Error browsing folder: ${error.message}`);
            }
        }
        
        // Update breadcrumb navigation
        function updateBreadcrumb(currentPath, parentPath) {
            const breadcrumb = document.getElementById('folderBreadcrumb');
            const pathParts = currentPath.split('/').filter(part => part !== '');
            
            let html = '<li class="breadcrumb-item"><a href="#" onclick="browseFolder(\'/\')">/</a></li>';
            
            let currentPathBuilder = '';
            for (let i = 0; i < pathParts.length; i++) {
                currentPathBuilder += '/' + pathParts[i];
                const isLast = i === pathParts.length - 1;
                
                if (isLast) {
                    html += `<li class="breadcrumb-item active">${pathParts[i]}</li>`;
                } else {
                    html += `<li class="breadcrumb-item"><a href="#" onclick="browseFolder('${currentPathBuilder}')">${pathParts[i]}</a></li>`;
                }
            }
            
            breadcrumb.innerHTML = html;
        }
        
        // Update current path display
        function updateCurrentPathDisplay(path) {
            document.getElementById('currentPath').textContent = path;
        }
        
        // Update folder contents display
        function updateFolderContents(folders, files) {
            const container = document.getElementById('folderContents');
            
            let html = '';
            
            // Add folders
            if (folders.length > 0) {
                html += '<h6 class="mt-3 mb-2"><i class="fas fa-folder"></i> Folders</h6>';
                folders.forEach(folder => {
                    html += `
                        <div class="folder-item" onclick="browseFolder('${folder.path}')">
                            <i class="fas fa-folder"></i> ${folder.name}
                        </div>
                    `;
                });
            }
            
            // Add files
            if (files.length > 0) {
                html += '<h6 class="mt-3 mb-2"><i class="fas fa-file"></i> Files</h6>';
                files.forEach(file => {
                    const size = formatFileSize(file.size);
                    html += `
                        <div class="file-item">
                            <i class="fas fa-file"></i> ${file.name} <small class="text-muted">(${size})</small>
                        </div>
                    `;
                });
            }
            
            if (folders.length === 0 && files.length === 0) {
                html = '<div class="text-muted">This folder is empty</div>';
            }
            
            container.innerHTML = html;
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Mount selected folder
        async function mountSelectedFolder() {
            if (!selectedFolder) {
                showStatus('warning', 'Please select a folder first');
                return;
            }
            
            try {
                const response = await fetch('/api/folder/mount', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        folder_path: selectedFolder
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('success', `Successfully mounted folder: ${data.unique_folder_name}`);
                    loadMountedFolders();
                    selectedFolder = null;
                } else {
                    showStatus('error', `Failed to mount folder: ${data.error_message}`);
                }
                
            } catch (error) {
                showStatus('error', `Error mounting folder: ${error.message}`);
            }
        }
        
        // Unmount selected folder
        async function unmountSelectedFolder() {
            if (!selectedFolder) {
                showStatus('warning', 'Please select a folder first');
                return;
            }
            
            if (confirm('Are you sure you want to unmount this folder?')) {
                await unmountFolder(selectedFolder);
            }
        }
        
        // Unmount specific folder
        async function unmountFolder(folderName) {
            try {
                const response = await fetch('/api/folder/unmount', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        folder_name: folderName
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('success', `Successfully unmounted folder: ${folderName}`);
                    loadMountedFolders();
                    if (selectedFolder === folderName) {
                        selectedFolder = null;
                    }
                } else {
                    showStatus('error', `Failed to unmount folder: ${data.error_message}`);
                }
                
            } catch (error) {
                showStatus('error', `Error unmounting folder: ${error.message}`);
            }
        }
        
        // Start scan for selected folder
        function startScanSelectedFolder() {
            if (!selectedFolder) {
                showStatus('warning', 'Please select a folder first');
                return;
            }
            
            // Redirect to scan folder page with the selected folder
            window.location.href = `/scan-folder?folder=${encodeURIComponent(selectedFolder)}`;
        }
        
        // Refresh mounted folders
        function refreshMountedFolders() {
            loadMountedFolders();
            showStatus('info', 'Refreshed mounted folders');
        }
        
        // Show status message
        function showStatus(type, message) {
            const container = document.getElementById('statusMessages');
            const alertClass = type === 'success' ? 'alert-success' : 
                             type === 'error' ? 'alert-danger' : 
                             type === 'warning' ? 'alert-warning' : 'alert-info';
            
            const html = `
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    <span class="status-indicator status-${type}"></span>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            container.innerHTML = html + container.innerHTML;
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                const alerts = container.querySelectorAll('.alert');
                if (alerts.length > 0) {
                    alerts[0].remove();
                }
            }, 5000);
        }
        
        // Select folder (called when clicking on folder items)
        function selectFolder(path) {
            selectedFolder = path;
            
            // Update visual selection
            document.querySelectorAll('.folder-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Find and select the clicked item
            event.target.closest('.folder-item').classList.add('selected');
            
            showStatus('info', `Selected folder: ${path}`);
        }
    </script>
</body>
</html>

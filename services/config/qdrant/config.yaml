# Qdrant Configuration for MEP AI NABOX
# This file contains optimized settings for the MEP AI NABOX system

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  enable_tls: false
  api_key: qdrant_api_key

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  on_disk_payload: true
  update_queue_size: 1000

cluster:
  enabled: false

telemetry:
  enabled: false

log_level: INFO

# Optimizer configuration for better performance with smaller datasets
optimizer:
  indexing_threshold: 100
  memmap_threshold: 10000
  vacuum_min_vector_number: 1000
  deleted_threshold: 0.2
  flush_interval_sec: 5

# Default collection configuration
default_collection_config:
  optimizer_config:
    indexing_threshold: 100
    memmap_threshold: 10000
    vacuum_min_vector_number: 1000
    deleted_threshold: 0.2
    flush_interval_sec: 5 
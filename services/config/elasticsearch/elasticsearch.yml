# Elasticsearch Configuration for MEP AI NABOX
# This file contains optimized settings for the MEP AI NABOX system

# Cluster Settings
cluster.name: mep-elasticsearch
node.name: mep-elasticsearch-node
node.roles: [ master, data, ingest ]

# Network Settings
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# Discovery Settings
discovery.type: single-node
discovery.seed_hosts: []

# Security Settings
xpack.security.enabled: false
xpack.security.transport.ssl.enabled: false
xpack.security.http.ssl.enabled: false

# Memory Settings
bootstrap.memory_lock: true

# Index Settings
action.auto_create_index: true
action.destructive_requires_name: false

# Logging
logger.level: INFO
path.logs: /usr/share/elasticsearch/logs

# Data Paths
path.data: /usr/share/elasticsearch/data

# JVM Settings (configured via environment variables)
# ES_JAVA_OPTS: -Xms1g -Xmx1g

# Index Management
indices.memory.index_buffer_size: 30%
indices.queries.cache.size: 10%
indices.fielddata.cache.size: 10%

# Search Settings
search.default_search_timeout: 30s
search.max_buckets: 100000

# Thread Pool Settings
thread_pool.write.size: 13
thread_pool.write.queue_size: 200
thread_pool.search.size: 13
thread_pool.search.queue_size: 1000

# Circuit Breaker Settings
indices.breaker.total.limit: 70%
indices.breaker.fielddata.limit: 40%
indices.breaker.request.limit: 60%

# Recovery Settings
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: 93%
cluster.routing.allocation.disk.watermark.high: 95%
cluster.routing.allocation.disk.watermark.flood_stage: 97%

# Snapshot Settings
path.repo: /usr/share/elasticsearch/snapshots 
services:
  # PostgreSQL - Primary metadata database
  postgres:
    image: postgres:15-alpine
    container_name: mep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mep_ainabox}
      POSTGRES_USER: ${POSTGRES_USER:-mep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mep_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mep_user} -d ${POSTGRES_DB:-mep_ainabox}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch - Full-text search engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mep-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-elastic_password}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=mep-elasticsearch
      - node.name=mep-elasticsearch-node
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Kibana - Elasticsearch management and visualization UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: mep-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-kibana_encryption_key_12345678901234567890123456789012}
      - SERVER_NAME=mep-kibana
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5601
      - TELEMETRY_ENABLED=false
    ports:
      - "5601:5601"
    volumes:
      - ./volumes/kibana:/usr/share/kibana/data
      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - elasticsearch

  # Qdrant - Vector database for embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mep-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_TLS=false
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-qdrant_api_key}
      - QDRANT__OPTIMIZER__INDEXING_THRESHOLD=100
      - QDRANT__OPTIMIZER__MEMMAP_THRESHOLD=10000
      - QDRANT__OPTIMIZER__VACUUM_MIN_VECTOR_NUMBER=1000
      - QDRANT__OPTIMIZER__DELETED_THRESHOLD=0.2
      - QDRANT__OPTIMIZER__FLUSH_INTERVAL_SEC=5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # HuggingFace Text Embeddings Inference Service
  huggingface-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: mep-huggingface-embeddings
    restart: unless-stopped
    environment:
      - MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8082:80"
    volumes:
      - huggingface_cache:/data
    command:
      - "--model-id"
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "--max-client-batch-size"
      - "200"
      - "--max-batch-requests"
      - "50"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Neo4j - Graph database for relationships
  neo4j:
    image: neo4j:5.15-community
    container_name: mep-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
      - "7473:7473"  # HTTPS
    volumes:
      - ./volumes/neo4j:/data
      - ./volumes/neo4j/logs:/logs
      - ./volumes/neo4j/import:/var/lib/neo4j/import
      - ./volumes/neo4j/plugins:/plugins
      - ./config/neo4j/neo4j.conf:/conf/neo4j.conf
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-neo4j_password} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis - Caching and session management
  redis:
    image: redis:7-alpine
    container_name: mep-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MinIO - Object storage for files and embeddings
  minio:
    image: minio/minio:latest
    container_name: mep-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data
      - ./config/minio/minio.conf:/etc/minio/minio.conf
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # n8n - Workflow automation platform
  n8n:
    image: n8nio/n8n:latest
    container_name: mep-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n_encryption_key_123}
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=UTC
      # Database configuration (using SQLite by default)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      # For PostgreSQL integration with existing postgres service
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      # - DB_POSTGRESDB_USER=${POSTGRES_USER:-mep_user}
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-mep_password}
      # External API credentials
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-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}
    ports:
      - "5678:5678"
    volumes:
      - ./volumes/n8n:/home/node/.n8n
      - ${N8N_WATCH_FOLDER:-./watch_folder}:/home/node/watch_folder:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres
      - redis

  # Flowise - LLM Flow Builder
  flowise:
    image: flowiseai/flowise:latest
    container_name: mep-flowise
    restart: unless-stopped
    environment:
      # Basic configuration
      - PORT=3000
      - HOST=0.0.0.0
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-admin}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:-admin123}
      - SECRETKEY=${FLOWISE_SECRET_KEY:-flowise_secret_key_123}
      - LOG_LEVEL=info
      - LOG_PATH=./logs
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=./database
      # For PostgreSQL integration with existing postgres service
      # - DATABASE_TYPE=postgres
      # - DATABASE_HOST=postgres
      # - DATABASE_PORT=5432
      # - DATABASE_NAME=${FLOWISE_DB_NAME:-flowise}
      # - DATABASE_USER=${POSTGRES_USER:-mep_user}
      # - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-mep_password}
      # Redis for session management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_DB=0
      # External API credentials
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-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}
      # Vector database connections
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_api_key}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-elastic_password}
      # Object storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minio_access_key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio_secret_key}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-flowise-files}
      - MINIO_USE_SSL=false
      # Graph database
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      # Security and CORS
      - CORS_ORIGINS=*
      - APIKEY_PATH=./api.json
      - TOOL_FUNCTION_TIME_LIMIT=15000
      - EXECUTION_MODE=local
      - DISABLE_FLOWISE_ANALYTICS=true
    ports:
      - "3001:3000"
    volumes:
      - ./volumes/flowise:/usr/src/app
      - ./volumes/flowise/logs:/usr/src/app/logs
      - ./volumes/flowise/database:/usr/src/app/database
      - ./volumes/flowise/api.json:/usr/src/app/api.json
      - ./volumes/flowise/credentials.json:/usr/src/app/credentials.json
      - ./volumes/flowise/custom:/usr/src/app/custom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres
      - redis
      - qdrant
      - elasticsearch
      - neo4j
      - minio

  # Development Services (Optional)

  # pgAdmin - PostgreSQL administration interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mep-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mep.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - dev

  # Elasticsearch Head - Elasticsearch management UI (REMOVED - Use Kibana instead)
  # elasticsearch-head:
  #   image: mobz/elasticsearch-head:5
  #   container_name: mep-elasticsearch-head
  #   restart: unless-stopped
  #   ports:
  #     - "9100:9100"
  #   environment:
  #     - ELASTICSEARCH_URL=http://elasticsearch:9200
  #   depends_on:
  #     - elasticsearch
  #   profiles:
  #     - dev

  # Neo4j Browser - Graph database interface (using built-in browser on port 7474)
  # neo4j-browser:
  #   image: neo4j/neo4j-browser:latest
  #   container_name: mep-neo4j-browser
  #   restart: unless-stopped
  #   ports:
  #     - "7473:7473"
  #   environment:
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USER=neo4j
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
  #   depends_on:
  #     - neo4j
  #   profiles:
  #     - dev

  # Redis Commander - Redis management interface
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mep-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - dev

  # Qdrant UI - Vector database management interface (custom HTML interface)
  qdrant-ui:
    build:
      context: ./qdrant-ui
      dockerfile: Dockerfile
    container_name: mep-qdrant-ui
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "7070:7070"
    depends_on:
      - qdrant
    profiles:
      - dev

  # MinIO Console - Object storage management (using built-in console on port 9001)
  # minio-console:
  #   image: minio/console:latest
  #   container_name: mep-minio-console
  #   restart: unless-stopped
  #   environment:
  #     CONSOLE_MINIO_SERVER: http://minio:9000
  #     CONSOLE_MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_access_key}
  #     CONSOLE_MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_key}
  #   ports:
  #     - "9002:9000"
  #   depends_on:
  #     - minio
  #   profiles:
  #     - dev

  # Monitoring Services (Optional)

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: mep-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volumes/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana - Monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mep-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_password}
    ports:
      - "3002:3000"
    volumes:
      - ./volumes/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  default:
    external: true
    name: mep-services-network

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
  kibana_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  flowise_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  huggingface_cache:
    driver: local 